openapi: 3.1.0
info:
  title: dCore Private Update Status
  version: 1.2.0
  description: Read-only access to the latest verified private dCore knowledge release.
servers:
  - url: https://dcore-update-bridge.ru-tonystark.workers.dev
paths:
  /v1/health:
    get:
      operationId: checkDcoreBridge
      summary: Verify that the private dCore update bridge is available.
      responses:
        "200":
          description: Bridge status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
  /v1/latest:
    get:
      operationId: getLatestDcoreRelease
      summary: Get the version, validation status, source commits, counts, and SHA-256 of the latest verified dCore release.
      description: Call this before claiming that the attached dCore Knowledge is current. This endpoint reports freshness but does not replace Custom GPT Knowledge files.
      responses:
        "200":
          description: Latest verified private dCore release manifest.
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - generated_at
                  - status
                  - sha256
                  - size
                  - bundle_sha256
                  - artifacts
                  - counts
                  - sources
                  - validation
                properties:
                  name:
                    type: string
                  generated_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                  sha256:
                    type: string
                  size:
                    type: integer
                  bundle_sha256:
                    type: string
                  artifacts:
                    type: object
                    additionalProperties:
                      type: object
                      required: [sha256, size]
                      properties:
                        sha256:
                          type: string
                        size:
                          type: integer
                  counts:
                    type: object
                    required: [cards, meta_entries, ide_diagnostics, retrieval_tests]
                    properties:
                      cards:
                        type: integer
                      meta_entries:
                        type: integer
                      ide_diagnostics:
                        type: integer
                      retrieval_tests:
                        type: integer
                  sources:
                    type: array
                    items:
                      type: object
                      required: [product, commit_sha, source_id]
                      properties:
                        product:
                          type: string
                        commit_sha:
                          type: string
                        source_id:
                          type: string
                  validation:
                    type: object
                    required: [integrity_check, foreign_key_errors, failures]
                    properties:
                      integrity_check:
                        type: string
                      foreign_key_errors:
                        type: integer
                      failures:
                        type: array
                        items:
                          type: string
        "401":
          description: Missing or invalid bearer API key.
