<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">One core, three independent deliveries</title>
  <desc id="desc">CLI, installed Skill and Custom GPT each contain the same dCore analysis engine and knowledge database. Static results and external runtime reports stay distinct.</desc>
  <rect width="760" height="250" rx="16" fill="#142336"/>
  <g stroke="#6894b6" fill="none" stroke-width="2"><path d="M140 66V100H620V66M380 66V110M380 173V198"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g fill="#233c53" stroke="#6aa6cc"><rect x="50" y="24" width="180" height="44" rx="9"/><rect x="290" y="24" width="180" height="44" rx="9"/><rect x="530" y="24" width="180" height="44" rx="9"/></g>
    <g fill="#f0f5ff" font-size="19"><text x="140" y="53">CLI</text><text x="380" y="53">Skill</text><text x="620" y="53">Custom GPT</text></g>
    <rect x="180" y="112" width="400" height="60" rx="10" fill="#173d3d" stroke="#65d9c3"/>
    <text x="380" y="139" fill="#e9fff9" font-size="20">dCore engine + SQLite</text>
    <text x="380" y="160" fill="#a4d5cb" font-size="14">API · examples · script flow · shader graphs</text>
    <text x="380" y="220" fill="#c9d8eb" font-size="16">Static findings ≠ a server or GPU test</text>
  </g>
</svg>
