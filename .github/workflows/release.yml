name: Release dCore

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check release identity
        run: |
          python -c "import os; from dcore import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__ + '.0'"
      - name: Install and verify
        run: |
          python -m pip install -e ".[dev,obfuscation]"
          python -m pytest -q
          python -m dcore.cli verify-skill --root . --json
      - name: Build distributions
        run: python .github/scripts/package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%.0}"
          gh release create "$GITHUB_REF_NAME" build/dcore-cli-*.zip build/dcore-skill-*.zip build/dcore-gpt-*.zip build/SHA256SUMS.txt --verify-tag --latest --title "dCore $version" --notes-file "docs/RELEASE-$version.md"
