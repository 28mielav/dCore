name: Maintain dCore knowledge

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish today's verified bundle even when upstream data is unchanged
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: dcore-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare isolated candidate
        run: |
          mkdir -p build/knowledge
          cp knowledge/dcore.sqlite build/knowledge/dcore.sqlite
          cp knowledge/DCORE_INSTRUCTIONS.txt build/knowledge/DCORE_INSTRUCTIONS.txt
          cp knowledge/manifest.json build/knowledge/manifest.json

      - name: Check upstream revisions
        id: upstream
        run: |
          python tools/update_knowledge.py --db build/knowledge/dcore.sqlite --check > build/check.json
          cat build/check.json
          required=$(python -c "import json; print(str(bool(json.load(open('build/check.json'))['update_required'])).lower())")
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: Refresh upstream sources
        if: steps.upstream.outputs.required == 'true'
        run: python tools/update_knowledge.py --db build/knowledge/dcore.sqlite

      - name: Remove updater backup from candidate
        run: rm -f build/knowledge/*.pre_update_*.sqlite

      - name: Validate candidate
        run: python tools/verify_knowledge.py --db build/knowledge/dcore.sqlite --output build/knowledge/manifest.json

      - name: Detect knowledge change
        id: changed
        run: |
          if [[ "${{ steps.upstream.outputs.required }}" != "true" ]] || cmp -s knowledge/dcore.sqlite build/knowledge/dcore.sqlite; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install verified knowledge
        if: steps.changed.outputs.value == 'true'
        run: |
          cp build/knowledge/dcore.sqlite knowledge/dcore.sqlite
          cp build/knowledge/manifest.json knowledge/manifest.json

      - name: Commit verified knowledge
        if: steps.changed.outputs.value == 'true'
        run: |
          git config user.name "dCore maintenance"
          git config user.email "dcore-maintenance@users.noreply.github.com"
          git add knowledge/dcore.sqlite knowledge/manifest.json
          git commit -m "knowledge: update verified upstream data"
          git push

      - name: Set up Node for bridge deploy
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Deploy freshness bridge
        working-directory: services/update-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Decide whether to publish
        id: publish
        run: |
          if [[ "${{ steps.changed.outputs.value }}" == "true" || "${{ inputs.publish_release || false }}" == "true" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dated private release
        if: steps.publish.outputs.value == 'true'
        run: |
          date_utc=$(date -u +%Y-%m-%d)
          mkdir -p "dist/dCore-$date_utc"
          cp build/knowledge/dcore.sqlite "dist/dCore-$date_utc/dcore.sqlite"
          cp build/knowledge/DCORE_INSTRUCTIONS.txt "dist/dCore-$date_utc/DCORE_INSTRUCTIONS.txt"
          cp build/knowledge/manifest.json "dist/dCore-$date_utc/manifest.json"
          cp tools/lint_denizen.py "dist/dCore-$date_utc/lint_denizen.py"
          cp tools/update_knowledge.py "dist/dCore-$date_utc/update_knowledge.py"
          cd dist
          zip -9 -r "dCore-$date_utc.zip" "dCore-$date_utc"
          sha256sum "dCore-$date_utc.zip" > "dCore-$date_utc.zip.sha256"

      - name: Replace today's private release
        if: steps.publish.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date_utc=$(date -u +%Y-%m-%d)
          gh release delete "$date_utc" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$date_utc" \
            "dist/dCore-$date_utc.zip" \
            "dist/dCore-$date_utc.zip.sha256" \
            "build/knowledge/manifest.json" \
            --title "$date_utc" \
            --notes "Verified private dCore Knowledge bundle for $date_utc. Replace the Custom GPT Knowledge files only when the manifest SHA-256 differs from the attached version."

      - name: Remove legacy timestamp releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^dcore-auto-' \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done || true

      - name: Upload maintenance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcore-maintenance-diagnostics
          path: |
            build/check.json
            build/knowledge/manifest.json
          if-no-files-found: ignore
          retention-days: 14
