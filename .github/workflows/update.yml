name: Verify dCore portable skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m pytest -q
      - name: Verify skill and experimental shader candidate
        run: |
          dcore verify-skill --root . --json
          dcore validate-shader skill/dcore/assets/heartbeat-26.3 --minecraft 26.3-snapshot-3 --pack-format 91 --json > temp-shader-report.json
          python -c "import json; r=json.load(open('temp-shader-report.json')); assert r['static_verdict']=='STATIC_OK', r"
      - name: Verify manifest
        run: |
          dcore verify --root . --output temp-manifest.json
          python -c "import json; r=json.load(open('temp-manifest.json')); assert r['status']=='verified', r['validation']['failures']"
      - name: Prove deterministic bundle
        run: |
          dcore build-skill --root . --output temp/dcore-skill-a.zip > temp/bundle-a.json
          cp temp/dcore-skill-a.zip /tmp/dcore-skill-a.zip
          dcore build-skill --root . --output temp/dcore-skill-b.zip > temp/bundle-b.json
          python -c "import hashlib; a=hashlib.sha256(open('/tmp/dcore-skill-a.zip','rb').read()).hexdigest(); b=hashlib.sha256(open('temp/dcore-skill-b.zip','rb').read()).hexdigest(); assert a==b, (a,b)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dcore-portable-skill
          path: |
            temp/dcore-skill-b.zip
            temp-shader-report.json
            temp-manifest.json
