name: Verify dCore portable skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m pytest -q
      - name: Verify portable skill
        run: |
          dcore verify-skill --root . --json
      - name: Verify manifest
        run: |
          mkdir -p build
          dcore verify --root . --output build/manifest.verify.json
          python -c "import json; r=json.load(open('build/manifest.verify.json')); assert r['status']=='verified', r['validation']['failures']"
      - name: Prove deterministic bundle
        run: |
          dcore build-skill --root . --output build/dcore-skill-a.zip > build/bundle-a.json
          cp build/dcore-skill-a.zip /tmp/dcore-skill-a.zip
          dcore build-skill --root . --output build/dcore-skill-b.zip > build/bundle-b.json
          python -c "import hashlib; a=hashlib.sha256(open('/tmp/dcore-skill-a.zip','rb').read()).hexdigest(); b=hashlib.sha256(open('build/dcore-skill-b.zip','rb').read()).hexdigest(); assert a==b, (a,b)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dcore-portable-skill
          path: |
            build/dcore-skill-b.zip
            build/manifest.verify.json
